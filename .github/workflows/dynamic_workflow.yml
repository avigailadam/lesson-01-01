name: Build All Images

on:
  pull_request:
    branches:
      - main

jobs:
  trigger_build:
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          repository: avigailadam/lesson-01-01
          path: ./01_01
      - name: Run Script
        id: run-script
        shell: cmd
        env:
          PYTHONPATH: ${{ github.workspace }}\01_01
        run: |
          python 01_01/script.py | tee script_output.txt
      - name: Upload Script Output as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: script-output
          path: script_output.txt
