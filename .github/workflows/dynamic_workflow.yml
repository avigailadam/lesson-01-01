name: Build All Images

on:
  pull_request:
    branches:
      - main

jobs:
  trigger_build:
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          repository: avigailadam/lesson-01-01
          path: ./01_01
      - name: Run Script
        id: run-script
        shell: cmd
        env:
          PYTHONPATH: ${{ github.workspace }}\01_01
        run: |
          python 01_01/script.py > script_output.txt
          set /p output=<script_output.txt
          echo "result=$(type script_output.txt)" >> $GITHUB_ENV
      - name: Debug Script Output
        shell: cmd
        run: |
          type script_output.txt
      - name: Generate Matrix
        id: set-matrix
        shell: cmd
        env:
          result: ${{ env.result }}
        run: |
          echo %result% > result.json
          set /p matrix=<result.json
          echo "matrix=%matrix%" >> $GITHUB_ENV
  dynamic_jobs:
    needs: trigger_build
    runs-on: windows-latest
    strategy:
      matrix:
        job_name: ${{ fromJson(needs.trigger_build.outputs.matrix) }}
    steps:
      - name: Build image for Bundle
        shell: cmd
        run: |
          echo "${{ matrix.job_name }}"